# 说明栏抄写提示词。只抄写，不纠错、不判断。错别字判定由 judge.notes_typo 负责。

extract.notes:
  text: |
    输入是工程图纸（工艺自控流程图）右侧「说明」区域的裁剪图，可能只是整块说明的其中一段。
    区域内可能有：带编号的条文（1、2、3…）、用箭头连接的流程框图、图例、字母代号表、改造说明段落。

    任务是逐行抄写看得见的文字：
    - 照抄原文，包括看起来像写错的字、半角标点、单位写法，一律不要改、不要补全、不要解释。
    - 看不清的字用「□」占位，不要猜。
    - 斜向水印「内部文件请勿外传」不是图纸内容，整段忽略。
    - 按从上到下、从左到右的阅读顺序输出。
    - 条文一条一行；一条内换行续写的内容合并到同一行。
    - 流程框图按箭头方向写成「节点→节点→节点」一行，分支另起一行。
    - 图例每个符号的名称一行，kind 填 图例；「文字代号」或字母代号表每一行代号一行，kind 填 表格。

    每一行输出三个键：
    - no：这一行的编号原文（如 1、2.、（3））；没有编号填空字符串。
    - kind：条文 | 框图节点 | 图例 | 表格 | 标题，五选一。「说明」「图例」「文字代号」这类标题行填 标题。
    - text：这一行的原文。

    lines 是这些行组成的数组。整张图没有任何文字时 lines 为空数组。
