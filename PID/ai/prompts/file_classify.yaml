# 文件分类提示词。输入文件首页图片，判断文件类型。

file_classify.classify:
  text: |
    输入是一份工程设计文件的第一页图片。判断它属于以下哪一类：
    1. 目录：标题区写明「资料图纸目录」，正文是含序号、文件号、名称、版次、张数的表格。
    2. 工艺自控流程图（PID/P&ID）：含工艺管线、设备、阀门、仪表符号，有管线编号和设备位号，是流程图形态。
    3. 平面图：含建构筑物、设备布置、管道走向的平面布置图，有指北针或比例尺，是俯视形态。
    若都不是，三项都填 false。

file_classify.is_catalog:
  text: |
    输入是文档首页的整页图片。判断这一页是不是「资料图纸目录」。
    资料图纸目录的特征：标题区写明资料图纸目录，正文是表格，含序号、文件号、名称、版次、张数等列。
    若是说明书正文、图纸、封面或其他非目录页，判为 false。
    只输出 JSON，不要解释。
