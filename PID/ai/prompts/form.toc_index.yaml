# 目录索引一致性的抽取提示词。审查点 YAML 只引用这里的 id。

form.toc_index.catalog:
  text: |
    这是设计文件目录。上方标题区是公共部分，适用于本套全部文件。
    下方表格列出本文件夹应当存在的文件。只抽取有序号和文件号的数据行，不要抽取表头、小计和空行。

form.toc_index.file:
  text: |
    输入是 Word 第一页的整页图片。看页眉和标题区。
    页眉没有写出的项目名称、专业、阶段、日期，从同一页标题区补上。
    页眉和正文冲突时，文件号、项目号、版次、共 X 页以页眉为准。
    名称是资料名称，如说明书、材料表、设备表，不是项目名称。

form.toc_index.drawing:
  text: |
    输入是长庆工程设计有限公司图纸右下角标题栏的裁剪图。只读标题栏内文字，栏位名称不要写进结果。
    公司名称「长庆工程设计有限公司」是印好的，不抽取。
    设计证书号、勘察证书号照抄栏内编号。
    制图、设计、校对、审核、项目负责人、审定各取该行签字栏里看得见的文字；整行空白则填空字符串。
    项目名称、区域名称、单元名称、专业单体名称、图纸名称分别对应标题栏右侧从上到下的五行。括号里的提示文字本身不要当作内容。
    阶段、项目号、比例、文件号、日期、专业、版次取底栏对应格子。图纸名称不是项目名称。
    比例栏是波浪线时照抄~，不要留空。底栏没有「共X张」格子时张数填空；有则只写数字。

form.toc_index.is_catalog:
  text: |
    输入是文档首页的整页图片。判断这一页是不是「资料图纸目录」。
    资料图纸目录的特征：标题区写明资料图纸目录，正文是表格，含序号、文件号、名称、版次、张数等列。
    若是说明书正文、图纸、封面或其他非目录页，判为 false。
    只输出 JSON，不要解释。
