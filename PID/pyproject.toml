[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changqing-review"
version = "0.1.0"
description = "长庆工程图纸智能审查"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "openai>=1.40",
  "pymupdf>=1.24",
  "pillow>=10.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
include = ["ai*", "backend*"]
